<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dibner Study Rooms: 2-minute survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Setup ----------
   1. Paste your Google Apps Script web app URL into ENDPOINT (see survey_backend.gs).
   2. Host this file (GitHub Pages, your site, etc.) and point the QR code at it.
*/
:root{
  color-scheme: light;
  --bg:#FBFAFD; --surface:#FFFFFF; --ink:#1E1A24; --muted:#6B6475;
  --line:#E4DFEA; --violet:#57068C; --violet-soft:#F1E8F8; --gold:#E2B33C;
  --on-violet:#FFFFFF; --focus:#8A3FC4;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#16121B; --surface:#211B28; --ink:#F2EEF6; --muted:#A79FB2;
    --line:#352D3F; --violet:#B47FE0; --violet-soft:#2E2340; --gold:#E9C25A;
    --on-violet:#16121B; --focus:#D2A8F2;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Figtree",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:20px 20px 28px}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.back{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:8px 4px;cursor:pointer;border-radius:8px}
.back[hidden]{visibility:hidden;display:block}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--violet);border-radius:3px;transition:width .3s ease}
.count{font-size:13px;color:var(--muted);min-width:42px;text-align:right}
.screen{flex:1;display:flex;flex-direction:column;padding-top:28px}
h1{font-size:28px;line-height:1.2;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.3;font-weight:650;margin:0 0 6px;letter-spacing:-.005em}
.hint{color:var(--muted);font-size:15px;margin:0 0 20px;line-height:1.5}
p{line-height:1.55;margin:0 0 14px;font-size:16px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opt{appearance:none;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:500;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;
  display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--violet)}
.opt[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.opt .tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:var(--on-violet)}
.opt[aria-pressed="true"] .tick{background:var(--violet);border-color:var(--violet)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.scale .opt{flex-direction:column;justify-content:center;text-align:center;padding:14px 4px;font-size:20px;font-weight:650}
.scale-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
.primary{appearance:none;border:0;width:100%;font:inherit;font-size:17px;font-weight:650;color:var(--on-violet);
  background:var(--violet);border-radius:14px;padding:16px;cursor:pointer;margin-top:auto}
.primary:disabled{opacity:.35;cursor:default}
.spacer{flex:1;min-height:24px}
textarea{width:100%;min-height:130px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;padding:14px;resize:vertical}
textarea:focus{outline:none;border-color:var(--violet)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 18px}
.sign{background:#FFFFFF;border:1.5px solid var(--line);border-radius:16px;padding:12px 10px 14px;text-align:center}
.sign img{width:100%;max-width:150px;height:auto;display:block;margin:0 auto 6px}
.sign b{display:block;color:#1E1A24;font-size:16px}
.sign span{display:block;color:#6B6475;font-size:13px;margin-top:2px}
.hero-img{width:132px;height:132px;border-radius:24px;background:#FFFFFF;display:grid;place-items:center;margin-bottom:20px;border:1.5px solid var(--line)}
.hero-img img{width:112px;height:auto}
.dial-img{width:100%;height:auto;border-radius:14px;border:1.5px solid var(--line);margin:4px 0 10px;display:block}
.small{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.err{color:#B3261E;font-size:14px;margin-top:10px;text-align:center}
@media (prefers-color-scheme: dark){.err{color:#F2B8B5}}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <button class="back" id="back" hidden aria-label="Go back">‹ Back</button>
    <div class="bar" aria-hidden="true"><i id="progress"></i></div>
    <span class="count" id="count"></span>
  </div>
  <section class="screen" id="screen" aria-live="polite"></section>
</main>

const steps = [
  {type:"intro"},
  {id:"q1", type:"single", title:"Where are you studying right now?",
   options:["Sensory-friendly pod","Individual study room","Group study room","Open study area","Other"]},
  {id:"q2", type:"single", title:"How often do you book a study room at Dibner?",
   options:["Never","Less than once a month","1–3 times a month","About once a week","Several times a week"]},
  {id:"q3", type:"single", title:"In the past month, have you seen a room marked as booked with nobody inside?",
   options:["Yes, often","Yes, once or twice","No","Not sure"]},
  {id:"q4", type:"single", title:"Have you ever arrived at a room you booked and found someone else in it?",
   options:["Yes","No"]},
  {id:"q5", type:"multi", title:"When you use an empty room without a booking, how do you feel?", hint:"Choose all that apply.",
   options:["Relaxed","Unsure how long I can stay","Worried about being asked to leave","Awkward if someone knocks","I don’t do this"]},
  {id:"q6", type:"single", title:"When your plans change, what do you usually do with your booking?",
   options:["Cancel it","Just don’t show up","It depends"]},
  {id:"q7", type:"multi", title:"When you don’t cancel, why not?", hint:"Choose all that apply.",
   skipIf:a=>a.q6==="Cancel it",
   options:["I forget","It’s too much hassle","I can’t find the link","I didn’t think it mattered","Other"]},
  {id:"q8", type:"scale", title:"“If no one checks in within 15 minutes, the room should be released to other students.”",
   hint:"How much do you agree?", low:"Strongly disagree", high:"Strongly agree"},
  {type:"sign"},
  {id:"q9", type:"single", title:"How would flipping the sign feel to you?",
   options:["Fun","Easy, I’d just do it","Neutral","A bit of a hassle","I’d probably forget"]},
  {id:"q10", type:"scale", title:"How likely would you be to flip the sign when you arrive and when you leave?",
   low:"Very unlikely", high:"Very likely"},
  {id:"q11", type:"single", title:"Does having the Bobcat on the sign make you more likely to use it?",
   options:["More likely","No difference","Less likely"]},
  {id:"q12", type:"multi", title:"What would motivate you to flip the sign or release a room early?", hint:"Choose all that apply.",
   options:["Priority booking","Longer booking time","A thank-you message","Collecting Bobcat badges or stickers","Nothing, I’d do it anyway","Other"]},
  {id:"q14", type:"single", img:"dial", title:"Here’s an early design of our door sign. At first glance, can you tell how to use it?",

];
const QUESTIONS = steps.filter(s=>s.id);
const answers = {};
let i = 0, history = [];
const $ = s=>document.querySelector(s);
const screen = $("#screen");

function visible(idx){const s=steps[idx]; return !(s.skipIf && s.skipIf(answers));}
function next(){history.push(i); do{i++}while(i<steps.length-1 && !visible(i)); render();}
function back(){ if(history.length){ i=history.pop(); render(); } }
$("#back").onclick = back;

function el(tag, attrs={}, kids=[]){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="text") e.textContent=v; else if(k.startsWith("on")) e[k]=v; else e.setAttribute(k,v); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&e.append(c)); return e;
}

function progress(){
  const s=steps[i]; const qIdx = s.id ? QUESTIONS.indexOf(s) : -1;
  const done = s.type==="done";
  const answered = done ? QUESTIONS.length : (qIdx>=0 ? qIdx : QUESTIONS.findIndex((q,k)=>steps.indexOf(q)>i));
  $("#progress").style.width = (Math.max(0,answered)/QUESTIONS.length*100)+"%";
  $("#count").textContent = qIdx>=0 ? `${qIdx+1} / ${QUESTIONS.length}` : "";
  $("#back").hidden = !history.length || done;
}

function render(){
  progress(); screen.innerHTML=""; const s=steps[i];
  if(s.type==="intro"){
    screen.append(
      el("div",{class:"hero-img"}, el("img",{src:IMG_FREE,alt:"The NYU Bobcat waving"})),
      el("h1",{text:"Help us make Dibner’s study rooms easier to find"}),
      el("p",{text:"We’re a student team in Hack Dibner 2026, working on study room bookings. This survey has 15 quick questions and takes about 3 minutes."}),
      el("p",{class:"hint",text:"It’s anonymous. We don’t collect your name or email."}),
      el("div",{class:"spacer"}),
      el("button",{class:"primary",onclick:next,text:"Start the survey"})
    ); focusFirst(); return;
  }
  if(s.type==="sign"){
    screen.append(
      el("h2",{text:"One idea we’re exploring"}),
      el("p",{text:"Imagine every study room door has a two-sided sign with the NYU Bobcat. You flip it when you arrive and flip it back when you leave."}),
      el("div",{class:"signs"},[
        el("div",{class:"sign"},[el("img",{src:IMG_FREE,alt:"Bobcat waving"}),el("b",{text:"Come on in"}),el("span",{text:"The room is free"})]),
        el("div",{class:"sign"},[el("img",{src:IMG_USE,alt:"Bobcat reading with headphones"}),el("b",{text:"I’m studying"}),el("span",{text:"Someone is inside"})])
      ]),
      el("div",{class:"spacer"}),
      el("button",{class:"primary",onclick:next,text:"Continue"})
    ); focusFirst(); return;
  }
  if(s.type==="done"){
    screen.append(
      el("div",{class:"hero-img"}, el("img",{src:IMG_FREE,alt:"The NYU Bobcat waving"})),
      el("h1",{text:"Thank you!"}),
      el("p",{text:"Your answers will help shape our proposal for better study rooms at Dibner."}),
      el("p",{class:"hint",text:"Team IDM INDEX, Hack Dibner 2026"})
    ); return;
  }
  screen.append(el("h2",{text:s.title}));
  if(s.img==="dial") screen.append(el("img",{src:IMG_DIAL,alt:"A round door sign with three sections: Available, Occupied, and Be Right Back with a timer dial",class:"dial-img"}));
  if(s.hint) screen.append(el("p",{class:"hint",text:s.hint})); else screen.append(el("div",{style:"height:14px"}));

  if(s.type==="single"){
    const box=el("div",{class:"opts",role:"group","aria-label":s.title});
    s.options.forEach(o=>{
      const b=el("button",{class:"opt","aria-pressed":String(answers[s.id]===o)},[el("span",{text:o})]);
      b.onclick=()=>{answers[s.id]=o; render(); setTimeout(next,180);};
      box.append(b);
    });
    screen.append(box);
  }
  if(s.type==="multi"){
    const cur=new Set(answers[s.id]||[]);
    const box=el("div",{class:"opts",role:"group","aria-label":s.title});
    const go=el("button",{class:"primary",text:"Next"}); go.disabled=!cur.size;
    s.options.forEach(o=>{
      const b=el("button",{class:"opt","aria-pressed":String(cur.has(o))},[el("span",{class:"tick","aria-hidden":"true",text:cur.has(o)?"✓":""}),el("span",{text:o})]);
      b.onclick=()=>{ cur.has(o)?cur.delete(o):cur.add(o); answers[s.id]=[...cur];
        b.setAttribute("aria-pressed",String(cur.has(o))); b.querySelector(".tick").textContent=cur.has(o)?"✓":""; go.disabled=!cur.size; };
      box.append(b);
    });
    go.onclick=next;
    screen.append(box, el("div",{class:"spacer"}), go);
  }
  if(s.type==="scale"){
    const box=el("div",{class:"scale",role:"group","aria-label":s.title});
    [1,2,3,4,5].forEach(n=>{
      const b=el("button",{class:"opt","aria-pressed":String(answers[s.id]===n),"aria-label":`${n} out of 5`},[el("span",{text:String(n)})]);
      b.onclick=()=>{answers[s.id]=n; render(); setTimeout(next,180);};
      box.append(b);
    });
    screen.append(box, el("div",{class:"scale-labels"},[el("span",{text:s.low}),el("span",{text:s.high})]));
  }
  if(s.type==="text"){
    const ta=el("textarea",{"aria-label":s.title,placeholder:"Type here, or leave it blank"}); ta.value=answers[s.id]||"";
    ta.oninput=()=>answers[s.id]=ta.value;
    const msg=el("div",{class:"err",role:"alert"});
    const go=el("button",{class:"primary",text:"Submit my answers"});
    go.onclick=async()=>{ go.disabled=true; go.textContent="Sending…"; msg.textContent="";
      try{ await submit(); next(); }
      catch(e){ go.disabled=false; go.textContent="Submit my answers"; msg.textContent="Your answers didn’t send. Check your connection and tap Submit again."; } };
    screen.append(ta, el("div",{class:"spacer"}), go, msg);
  }
  focusFirst();
}
function focusFirst(){ const f=screen.querySelector("button,textarea"); if(f && history.length) f.focus({preventScroll:true}); }

async function submit(){
  const row={submittedAt:new Date().toISOString()};
  QUESTIONS.forEach(q=>{ const v=answers[q.id]; row[q.id]= Array.isArray(v)? v.join("; ") : (v ?? ""); });
  if(!ENDPOINT){ console.warn("ENDPOINT is empty; response not saved:", row); return; }
  await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(row)});
}
render();
</script>
</body>
</html>
